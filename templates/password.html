{% extends "base.html" %}
{% block content %}
<div class="login-box" style="max-width:420px">
  <h1>修改密码</h1>
  <p class="muted">设置新的管理员登录密码，修改后请使用新密码登录。</p>
  <label>新密码<input type="password" id="new_password" autocomplete="new-password"></label>
  <label>确认新密码<input type="password" id="confirm_password" autocomplete="new-password"></label>
  <div style="margin-top:8px"><button id="btn-chpw" class="primary">保存新密码</button></div>
  <div id="chpw-result" class="result hidden"></div>
</div>
<script>
(function () {
  const csrf = document.querySelector('meta[name="csrf-token"]').content;
  const $ = (id) => document.getElementById(id);
  $('btn-chpw').addEventListener('click', async () => {
    const np = $('new_password').value, cp = $('confirm_password').value;
    if (np !== cp) { show('❌ 两次输入的新密码不一致'); return; }
    if (np.length < 6) { show('❌ 新密码至少 6 位'); return; }
    const btn = $('btn-chpw'); btn.disabled = true; btn.textContent = '保存中...';
    try {
      const r = await fetch('/api/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf },
        body: JSON.stringify({ new_password: np }),
      });
      const d = await r.json();
      if (d.ok) {
        show('✅ ' + d.message);
        $('new_password').value = $('confirm_password').value = '';
      } else {
        show('❌ ' + (d.error || '修改失败'));
      }
    } catch (e) { show('请求出错：' + e.message); }
    finally { btn.disabled = false; btn.textContent = '保存新密码'; }
  });
  function show(t) { const el = $('chpw-result'); el.textContent = t; el.classList.remove('hidden'); }
})();
</script>
{% endblock %}
